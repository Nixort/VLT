# VLT/1 daemon: local Unix-socket vault process.

[package]
name = "vlt1-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "VLT/1 local vault daemon"

[lints]
workspace = true

[dependencies]
anyhow = "=1.0.103"
base64 = "=0.22.0"
clap = { version = "=4.5.1", features = ["derive"] }
nix = { version = "=0.29.0", features = ["socket", "user"] }
zeroize = "=1.7.0"
vlt1-core = { path = "../vlt1-core", version = "0.2.0" }
vlt1-protocol = { path = "../vlt1-protocol", version = "0.2.0" }

[dev-dependencies]
tempfile = "=3.10.1"

[[bin]]
name = "vlt1d"
path = "src/main.rs"
