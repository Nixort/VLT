[package]
name = "vlt1-witness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "VLT/1 independently deployable freshness witness service"

[lints]
workspace = true

[dependencies]
anyhow = "=1.0.103"
clap = { version = "=4.5.1", features = ["derive"] }
constant_time_eq = "=0.3.1"
ed25519-dalek = { version = "=2.1.1", features = ["rand_core"] }
hex = "=0.4.3"
rand = "=0.8.6"
rusqlite = { version = "=0.31.0", features = ["bundled"] }
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.114"
sha2 = "=0.10.8"
tiny_http = "=0.12.0"
vlt1-core = { path = "../vlt1-core" }
zeroize = "=1.7.0"

[dev-dependencies]
tempfile = "=3.10.1"

[[bin]]
name = "vlt1-witnessd"
path = "src/main.rs"
