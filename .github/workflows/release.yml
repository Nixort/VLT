name: VLT/1 release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  quality:
    name: Release quality gates
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4.1.7, pinned by immutable commit SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # dtolnay/rust-toolchain master, pinned by immutable commit SHA.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p vlt1-core --features fault-injection --locked
      - run: cargo build --release --workspace --locked

  msrv:
    name: Release MSRV 1.75 locked build
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4.1.7, pinned by immutable commit SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # dtolnay/rust-toolchain master, pinned by immutable commit SHA.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.75.0
      - run: cargo +1.75.0 check --workspace --locked

  supply-chain:
    name: Release dependency and license policy
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4.1.7, pinned by immutable commit SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # EmbarkStudios/cargo-deny-action v2, pinned by immutable commit SHA.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check
          arguments: --all-features

  release:
    name: Build signed release bundle
    runs-on: ubuntu-24.04
    needs: [quality, msrv, supply-chain]
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      # actions/checkout v4.1.7, pinned by immutable commit SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # dtolnay/rust-toolchain master, pinned by immutable commit SHA.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Verify tag matches workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          test "$TAG" = "v$version"
      - name: Build Linux release binaries
        run: cargo build --release --workspace --locked
      - name: Package deterministic release bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bundle="VLT-${TAG}-linux-x86_64"
          mkdir -p "dist/$bundle"
          install -m 0755 target/release/vlt1 "dist/$bundle/vlt1"
          install -m 0755 target/release/vlt1d "dist/$bundle/vlt1d"
          install -m 0755 target/release/vlt1-witnessd "dist/$bundle/vlt1-witnessd"
          install -m 0755 target/release/vlt1-witness-key "dist/$bundle/vlt1-witness-key"
          install -m 0755 target/release/vlt1-bench "dist/$bundle/vlt1-bench"
          notes="docs/releases/${TAG}.md"
          test -f "$notes"
          cp "$notes" "dist/RELEASE_NOTES.md"
          cat >> "dist/RELEASE_NOTES.md" <<EOF

          ## Release bundle and verification

          This release contains Linux x86_64 binaries built from commit ${GITHUB_SHA}
          with the locked dependency graph. Verify the download before use:

          \\`\\`\\`sh
          sha256sum --check SHA256SUMS
          gh attestation verify "VLT-${TAG}-linux-x86_64.tar.gz" -R "${GITHUB_REPOSITORY}"
          \\`\\`\\`

          The bundle contains \\`vlt1\\`, \\`vlt1d\\`, \\`vlt1-witnessd\\`,
          \\`vlt1-witness-key\\`, and \\`vlt1-bench\\`.
          EOF
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@0" \
            -C dist -czf "dist/${bundle}.tar.gz" "$bundle"
          sha256sum "dist/${bundle}.tar.gz" > dist/SHA256SUMS
      # anchore/sbom-action v0, pinned by immutable commit SHA.
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: dist/vlt1.spdx.json
          upload-artifact: false
          upload-release-assets: false
      # actions/attest v4, pinned by immutable commit SHA.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/VLT-${{ github.ref_name }}-linux-x86_64.tar.gz
          sbom-path: dist/vlt1.spdx.json
      # softprops/action-gh-release v2, pinned by immutable commit SHA.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/VLT-${{ github.ref_name }}-linux-x86_64.tar.gz
            dist/SHA256SUMS
            dist/vlt1.spdx.json
