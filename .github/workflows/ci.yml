name: VLT/1 CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Refresh advisories even when the dependency lockfile has not changed.
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  quality:
    name: Stable quality gates
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4.1.7, pinned by immutable commit SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # dtolnay/rust-toolchain master, pinned by immutable commit SHA.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p vlt1-core --features fault-injection --locked
      - run: cargo build --release --workspace --locked

  msrv:
    name: MSRV 1.75 locked build
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4.1.7, pinned by immutable commit SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # dtolnay/rust-toolchain master, pinned by immutable commit SHA.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.75.0
      # `rust-toolchain.toml` selects stable for normal development; the explicit
      # override makes this job prove the documented MSRV rather than that default.
      - run: cargo +1.75.0 check --workspace --locked

  supply-chain:
    name: Dependency and license policy
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4.1.7, pinned by immutable commit SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # EmbarkStudios/cargo-deny-action v2, pinned by immutable commit SHA.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check
          arguments: --all-features
