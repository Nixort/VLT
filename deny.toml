# VLT/1 dependency policy. Every exception must state an expiry or a reason.

[graph]
all-features = true

[advisories]
ignore = []
unmaintained = "workspace"
unsound = "all"

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { crate = "openssl", use-instead = "rustls", reason = "VLT/1 uses rustls-backed HTTPS only" },
  { crate = "openssl-sys", use-instead = "rustls", reason = "VLT/1 avoids native OpenSSL bindings" },
  { crate = "libssh2-sys", reason = "VLT/1 has no SSH transport requirement" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "GPL-3.0-or-later",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]
exceptions = []
